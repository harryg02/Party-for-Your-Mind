
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>How Do You Read? | U-M Digital Accessibility</title>

  <style>
    :root {
      /* U-M primary colors */
      --um-blue: #00274c;
      --um-maize: #ffcb05;

      /* U-M supporting colors */
      --pms-7502: #cfc096;
      --burton-beige: #9b9a6d;
      --angell-ash: #989c97;
      --law-quad-stone: #655a52;

      --black: #000000;
      --white: #ffffff;
      --page-background: #f7f6f2;
      --focus: #2f65a7;
      --empty-ring: #d9d7cf;

      /* Chart assignments */
      --laptop: var(--um-blue);
      --mobile: var(--um-maize);
      --tablet: var(--pms-7502);
      --audio: var(--burton-beige);
      --print: var(--angell-ash);
      --braille: var(--law-quad-stone);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--page-background);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button {
      font: inherit;
    }

    header {
      display: flex;
      min-height: 72px;
      align-items: center;
      padding: 0.7rem clamp(1rem, 4vw, 3rem);
      background: var(--um-blue);
      color: var(--white);
      border-bottom: 6px solid var(--um-maize);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .block-m {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      flex: 0 0 auto;
      background: var(--um-maize);
      color: var(--um-blue);
      font-size: 1.75rem;
      font-weight: 900;
      line-height: 1;
    }

    .brand-name,
    .brand-subtitle {
      margin: 0;
    }

    .brand-name {
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 700;
    }

    .brand-subtitle {
      color: var(--white);
      font-size: 0.9rem;
    }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding:
        clamp(1.25rem, 3vh, 2.5rem)
        clamp(1rem, 4vw, 2.5rem);
    }

    h1 {
      margin: 0;
      color: var(--um-blue);
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1;
      text-align: center;
      letter-spacing: -0.035em;
    }

    .instructions {
      margin: 0.65rem auto 1.5rem;
      font-size: clamp(1rem, 2vw, 1.2rem);
      text-align: center;
    }

    .content-layout {
      display: grid;
      grid-template-columns: minmax(480px, 0.95fr) minmax(520px, 1.05fr);
      gap: clamp(1.5rem, 4vw, 3rem);
      align-items: center;
    }

    /*
      Answer selectors
    */

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(135px, 1fr));
      gap: 1rem;
    }

    .answer-button {
      display: flex;
      min-height: 165px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 1rem;
      background: var(--white);
      color: var(--um-blue);
      border: 3px solid var(--um-blue);
      border-radius: 12px;
      box-shadow: 0 4px 0 rgb(0 39 76 / 16%);
      cursor: pointer;
      transition:
        background-color 150ms ease,
        transform 150ms ease,
        box-shadow 150ms ease;
    }

    .answer-button:hover {
      background: #f3efdF;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgb(0 39 76 / 18%);
    }

    .answer-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgb(0 39 76 / 18%);
    }

    .answer-button.just-selected {
      background: var(--um-maize);
    }

    .answer-button:focus-visible,
    .reset-button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 4px;
    }

    .option-icon {
      width: 68px;
      height: 68px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option-name {
      font-size: 1.08rem;
      font-weight: 700;
      text-align: center;
    }

    /*
      Results and donut chart
    */

    .results-panel {
      padding: 1rem;
      background: var(--white);
      border: 1px solid var(--pms-7502);
      border-radius: 16px;
      box-shadow: 0 5px 20px rgb(0 39 76 / 10%);
    }

    .results-heading {
      margin: 0 0 0.25rem;
      color: var(--um-blue);
      font-size: 1.35rem;
      text-align: center;
    }

    .chart-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .donut-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .donut-background,
    .donut-segment {
      fill: none;
      stroke-width: 42;
    }

    .donut-background {
      stroke: var(--empty-ring);
    }

    .donut-segment {
      stroke-dasharray: 0 100;
      stroke-dashoffset: 0;
      stroke-linecap: butt;
      transition:
        stroke-dasharray 300ms ease,
        stroke-dashoffset 300ms ease;
    }

    .chart-center-number {
      fill: var(--um-blue);
      font-size: 46px;
      font-weight: 800;
      text-anchor: middle;
    }

    .chart-center-label {
      fill: var(--black);
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }

    .chart-empty-message {
      fill: var(--black);
      font-size: 13px;
      text-anchor: middle;
    }

    /*
      Labels are drawn in the chart itself and connected
      directly to their corresponding sections.
    */

    .segment-label {
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .segment-label.is-visible {
      opacity: 1;
    }

    .label-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label-dot {
      stroke: var(--white);
      stroke-width: 2;
    }

    .label-name {
      fill: var(--black);
      font-size: 15px;
      font-weight: 700;
    }

    .label-value {
      fill: var(--black);
      font-size: 13px;
    }

    .results-actions {
      display: flex;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .reset-button {
      padding: 0.55rem 1rem;
      background: var(--white);
      color: var(--um-blue);
      border: 2px solid var(--um-blue);
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:hover {
      background: var(--um-blue);
      color: var(--white);
    }

    .privacy-note {
      margin: 0.65rem 0 0;
      color: var(--black);
      font-size: 0.8rem;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      white-space: nowrap;
      border: 0;
      clip-path: inset(50%);
    }

    @media (max-width: 1050px) {
      .content-layout {
        grid-template-columns: 1fr;
      }

      .options {
        grid-template-columns: repeat(6, minmax(105px, 1fr));
      }

      .answer-button {
        min-height: 135px;
      }

      .option-icon {
        width: 54px;
        height: 54px;
      }
    }

    @media (max-width: 780px) {
      .options {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 500px) {
      .brand-subtitle {
        display: none;
      }

      .options {
        grid-template-columns: repeat(2, 1fr);
      }

      .answer-button {
        min-height: 135px;
      }

      .results-panel {
        padding-inline: 0.25rem;
      }

      .label-name {
        font-size: 14px;
      }

      .label-value {
        font-size: 12px;
      }
    }

    @media (max-width: 350px) {
      .options {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .answer-button,
      .donut-segment,
      .segment-label {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      .answer-button,
      .reset-button {
        border: 2px solid ButtonText;
      }

      .label-line {
        stroke: CanvasText !important;
      }

      .label-dot {
        fill: CanvasText !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="block-m" aria-hidden="true">M</div>

      <div>
        <p class="brand-name">University of Michigan</p>
        <p class="brand-subtitle">Digital Accessibility</p>
      </div>
    </div>
  </header>

  <main>
    <h1>How do you read?</h1>

    <p class="instructions">
      Select a format to add a response.
    </p>

    <div class="content-layout">
      <section class="options" aria-label="Reading format options">
        <button
          class="answer-button"
          type="button"
          data-option="laptop"
        >
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="11" y="10" width="42" height="32" rx="2"></rect>
            <path d="M6 48h52l-4 6H10z"></path>
            <path d="M27 48h10"></path>
          </svg>

          <span class="option-name">Laptop</span>
        </button>

        <button
          class="answer-button"
          type="button"
          data-option="mobile"
        >
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="20" y="5" width="24" height="54" rx="5"></rect>
            <path d="M28 10h8"></path>
            <circle cx="32" cy="53" r="1.5"></circle>
          </svg>

          <span class="option-name">Mobile</span>
        </button>

        <button
          class="answer-button"
          type="button"
          data-option="tablet"
        >
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="10" width="48" height="40" rx="4"></rect>
            <circle cx="32" cy="55" r="1.5"></circle>
            <path d="M13 15h38v30H13z"></path>
          </svg>

          <span class="option-name">Tablet</span>
        </button>

        <button
          class="answer-button"
          type="button"
          data-option="audio"
        >
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 35v-6a18 18 0 0 1 36 0v6"></path>
            <rect x="8" y="32" width="10" height="20" rx="4"></rect>
            <rect x="46" y="32" width="10" height="20" rx="4"></rect>
            <path d="M51 51c-2 5-6 7-13 7"></path>
            <circle cx="35" cy="58" r="2"></circle>
          </svg>

          <span class="option-name">Audio</span>
        </button>

        <button
          class="answer-button"
          type="button"
          data-option="print"
        >
          <!-- Traditional open-book icon -->
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 16c-6-5-14-7-23-6v36c9-1 17 1 23 6"></path>
            <path d="M32 16c6-5 14-7 23-6v36c-9-1-17 1-23 6"></path>
            <path d="M32 16v36"></path>
            <path d="M14 18c5 0 10 1 14 4"></path>
            <path d="M14 26c5 0 10 1 14 4"></path>
            <path d="M50 18c-5 0-10 1-14 4"></path>
            <path d="M50 26c-5 0-10 1-14 4"></path>
            <path d="M9 46l-3 3c9-1 18 1 26 7"></path>
            <path d="M55 46l3 3c-9-1-18 1-26 7"></path>
          </svg>

          <span class="option-name">Print</span>
        </button>

        <button
          class="answer-button"
          type="button"
          data-option="braille"
        >
          <svg class="option-icon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="17" cy="13" r="4"></circle>
            <circle cx="17" cy="32" r="4"></circle>
            <circle cx="17" cy="51" r="4"></circle>
            <circle cx="32" cy="13" r="4"></circle>
            <circle cx="32" cy="32" r="4"></circle>
            <circle cx="32" cy="51" r="4"></circle>
            <circle cx="47" cy="13" r="4"></circle>
            <circle cx="47" cy="32" r="4"></circle>
            <circle cx="47" cy="51" r="4"></circle>
          </svg>

          <span class="option-name">Braille</span>
        </button>
      </section>

      <section class="results-panel" aria-labelledby="results-heading">
        <h2 class="results-heading" id="results-heading">
          Live responses
        </h2>

        <div class="chart-container">
          <svg
            class="donut-chart"
            id="donut-chart"
            viewBox="0 0 500 360"
            role="img"
            aria-labelledby="chart-title chart-description"
          >
            <title id="chart-title">Reading format responses</title>
            <desc id="chart-description">No responses yet.</desc>

            <!-- Donut -->
            <circle
              class="donut-background"
              cx="250"
              cy="180"
              r="100"
              pathLength="100"
            ></circle>

            <g
              transform="rotate(-90 250 180)"
              aria-hidden="true"
            >
              <circle
                class="donut-segment"
                data-segment="laptop"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--laptop)"
              ></circle>

              <circle
                class="donut-segment"
                data-segment="mobile"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--mobile)"
              ></circle>

              <circle
                class="donut-segment"
                data-segment="tablet"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--tablet)"
              ></circle>

              <circle
                class="donut-segment"
                data-segment="audio"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--audio)"
              ></circle>

              <circle
                class="donut-segment"
                data-segment="print"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--print)"
              ></circle>

              <circle
                class="donut-segment"
                data-segment="braille"
                cx="250"
                cy="180"
                r="100"
                pathLength="100"
                stroke="var(--braille)"
              ></circle>
            </g>

            <!-- Center total -->
            <g aria-hidden="true">
              <text
                class="chart-center-number"
                id="total-count"
                x="250"
                y="175"
              >0</text>

              <text
                class="chart-center-label"
                x="250"
                y="199"
              >Total responses</text>

              <text
                class="chart-empty-message"
                id="empty-message"
                x="250"
                y="222"
              >No responses yet</text>
            </g>

            <!-- Labels are positioned dynamically -->
            <g id="chart-labels" aria-hidden="true">
              <g class="segment-label" data-label-group="laptop">
                <polyline
                  class="label-line"
                  data-label-line="laptop"
                  stroke="var(--laptop)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="laptop"
                  r="5"
                  fill="var(--laptop)"
                ></circle>
                <text data-label-text="laptop">
                  <tspan class="label-name">Laptop</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>

              <g class="segment-label" data-label-group="mobile">
                <polyline
                  class="label-line"
                  data-label-line="mobile"
                  stroke="var(--mobile)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="mobile"
                  r="5"
                  fill="var(--mobile)"
                ></circle>
                <text data-label-text="mobile">
                  <tspan class="label-name">Mobile</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>

              <g class="segment-label" data-label-group="tablet">
                <polyline
                  class="label-line"
                  data-label-line="tablet"
                  stroke="var(--tablet)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="tablet"
                  r="5"
                  fill="var(--tablet)"
                ></circle>
                <text data-label-text="tablet">
                  <tspan class="label-name">Tablet</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>

              <g class="segment-label" data-label-group="audio">
                <polyline
                  class="label-line"
                  data-label-line="audio"
                  stroke="var(--audio)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="audio"
                  r="5"
                  fill="var(--audio)"
                ></circle>
                <text data-label-text="audio">
                  <tspan class="label-name">Audio</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>

              <g class="segment-label" data-label-group="print">
                <polyline
                  class="label-line"
                  data-label-line="print"
                  stroke="var(--print)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="print"
                  r="5"
                  fill="var(--print)"
                ></circle>
                <text data-label-text="print">
                  <tspan class="label-name">Print</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>

              <g class="segment-label" data-label-group="braille">
                <polyline
                  class="label-line"
                  data-label-line="braille"
                  stroke="var(--braille)"
                ></polyline>
                <circle
                  class="label-dot"
                  data-label-dot="braille"
                  r="5"
                  fill="var(--braille)"
                ></circle>
                <text data-label-text="braille">
                  <tspan class="label-name">Braille</tspan>
                  <tspan class="label-value"></tspan>
                </text>
              </g>
            </g>
          </svg>
        </div>

        <div class="results-actions">
          <button class="reset-button" id="reset-button" type="button">
            Reset responses
          </button>
        </div>

        <p class="privacy-note">
          Responses are stored only in this browser.
        </p>
      </section>
    </div>

    <div
      class="sr-only"
      id="live-announcement"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </main>

  <script>
    (() => {
      "use strict";

      const storageKey = "um-reading-format-responses";

      const options = [
        "laptop",
        "mobile",
        "tablet",
        "audio",
        "print",
        "braille"
      ];

      const labels = {
        laptop: "Laptop",
        mobile: "Mobile",
        tablet: "Tablet",
        audio: "Audio",
        print: "Print",
        braille: "Braille"
      };

      const defaultCounts = {
        laptop: 0,
        mobile: 0,
        tablet: 0,
        audio: 0,
        print: 0,
        braille: 0
      };

      const chart = {
        centerX: 250,
        centerY: 180,
        radius: 100,
        labelStartRadius: 122,
        labelBendRadius: 143,
        leftElbowX: 118,
        rightElbowX: 382,
        leftTextX: 102,
        rightTextX: 398,
        minimumY: 48,
        maximumY: 312,
        minimumGap: 52
      };

      let counts = loadCounts();

      const buttons = document.querySelectorAll(".answer-button");
      const totalElement = document.getElementById("total-count");
      const emptyMessage = document.getElementById("empty-message");
      const chartDescription =
        document.getElementById("chart-description");
      const announcement =
        document.getElementById("live-announcement");
      const resetButton = document.getElementById("reset-button");

      function loadCounts() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));

          if (!saved || typeof saved !== "object") {
            return { ...defaultCounts };
          }

          return options.reduce((result, option) => {
            const value = Number(saved[option]);

            result[option] =
              Number.isInteger(value) && value >= 0 ? value : 0;

            return result;
          }, {});
        } catch {
          return { ...defaultCounts };
        }
      }

      function saveCounts() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(counts));
        } catch {
          // Counting still works if browser storage is unavailable.
        }
      }

      function getTotal() {
        return Object.values(counts).reduce(
          (sum, count) => sum + count,
          0
        );
      }

      function getPercentage(count, total) {
        return total === 0 ? 0 : (count / total) * 100;
      }

      function formatPercentage(percentage) {
        if (percentage === 0) {
          return "0%";
        }

        if (percentage >= 10) {
          return `${Math.round(percentage)}%`;
        }

        return `${percentage.toFixed(1)}%`;
      }

      function polarPoint(angleInDegrees, radius) {
        const radians = angleInDegrees * Math.PI / 180;

        return {
          x: chart.centerX + Math.cos(radians) * radius,
          y: chart.centerY + Math.sin(radians) * radius
        };
      }

      /*
        Prevent labels on the same side of the donut from overlapping.
      */
      function distributeLabels(entries) {
        if (entries.length === 0) {
          return;
        }

        entries.sort((a, b) => a.desiredY - b.desiredY);

        entries[0].labelY = Math.max(
          chart.minimumY,
          entries[0].desiredY
        );

        for (let index = 1; index < entries.length; index += 1) {
          entries[index].labelY = Math.max(
            entries[index].desiredY,
            entries[index - 1].labelY + chart.minimumGap
          );
        }

        const overflow =
          entries[entries.length - 1].labelY - chart.maximumY;

        if (overflow > 0) {
          entries.forEach((entry) => {
            entry.labelY -= overflow;
          });
        }

        for (
          let index = entries.length - 2;
          index >= 0;
          index -= 1
        ) {
          const maximumAllowed =
            entries[index + 1].labelY - chart.minimumGap;

          entries[index].labelY = Math.min(
            entries[index].labelY,
            maximumAllowed
          );
        }

        if (entries[0].labelY < chart.minimumY) {
          const adjustment = chart.minimumY - entries[0].labelY;

          entries.forEach((entry) => {
            entry.labelY += adjustment;
          });
        }
      }

      function setLabelPosition(entry) {
        const group = document.querySelector(
          `[data-label-group="${entry.option}"]`
        );
        const line = document.querySelector(
          `[data-label-line="${entry.option}"]`
        );
        const dot = document.querySelector(
          `[data-label-dot="${entry.option}"]`
        );
        const text = document.querySelector(
          `[data-label-text="${entry.option}"]`
        );

        const nameText = text.querySelector(".label-name");
        const valueText = text.querySelector(".label-value");

        const isRight = entry.side === "right";
        const elbowX = isRight
          ? chart.rightElbowX
          : chart.leftElbowX;
        const textX = isRight
          ? chart.rightTextX
          : chart.leftTextX;
        const textAnchor = isRight ? "start" : "end";

        line.setAttribute(
          "points",
          [
            `${entry.start.x},${entry.start.y}`,
            `${entry.bend.x},${entry.bend.y}`,
            `${elbowX},${entry.labelY}`,
            `${isRight ? textX - 7 : textX + 7},${entry.labelY}`
          ].join(" ")
        );

        dot.setAttribute("cx", entry.start.x);
        dot.setAttribute("cy", entry.start.y);

        text.setAttribute("x", textX);
        text.setAttribute("y", entry.labelY - 4);
        text.setAttribute("text-anchor", textAnchor);

        nameText.setAttribute("x", textX);
        nameText.setAttribute("dy", "0");

        valueText.setAttribute("x", textX);
        valueText.setAttribute("dy", "19");
        valueText.textContent =
          `${entry.count} · ${formatPercentage(entry.percentage)}`;

        group.classList.add("is-visible");
      }

      function hideAllLabels() {
        document.querySelectorAll(".segment-label").forEach((group) => {
          group.classList.remove("is-visible");
        });
      }

      function createAccessibleDescription(total) {
        if (total === 0) {
          return "No reading format responses yet.";
        }

        const details = options.map((option) => {
          const count = counts[option];
          const percentage = getPercentage(count, total);

          return (
            `${labels[option]}: ${count} ` +
            `${count === 1 ? "response" : "responses"}, ` +
            `${formatPercentage(percentage)}`
          );
        });

        return (
          `${total} total responses. ` +
          `${details.join(". ")}.`
        );
      }

      function updateChart() {
        const total = getTotal();
        let cumulativePercentage = 0;
        const leftLabels = [];
        const rightLabels = [];

        hideAllLabels();

        options.forEach((option) => {
          const count = counts[option];
          const percentage = getPercentage(count, total);
          const segment = document.querySelector(
            `[data-segment="${option}"]`
          );

          segment.style.strokeDasharray =
            `${percentage} ${100 - percentage}`;
          segment.style.strokeDashoffset =
            `${-cumulativePercentage}`;

          if (count > 0) {
            /*
              Segment begins at -90 degrees because the donut is
              visually rotated to start at the top.
            */
            const midpoint =
              -90 +
              (cumulativePercentage + percentage / 2) * 3.6;

            const start = polarPoint(
              midpoint,
              chart.labelStartRadius
            );
            const bend = polarPoint(
              midpoint,
              chart.labelBendRadius
            );

            const entry = {
              option,
              count,
              percentage,
              start,
              bend,
              desiredY: bend.y,
              side: Math.cos(midpoint * Math.PI / 180) >= 0
                ? "right"
                : "left"
            };

            if (entry.side === "right") {
              rightLabels.push(entry);
            } else {
              leftLabels.push(entry);
            }
          }

          cumulativePercentage += percentage;
        });

        distributeLabels(leftLabels);
        distributeLabels(rightLabels);

        leftLabels.forEach(setLabelPosition);
        rightLabels.forEach(setLabelPosition);

        totalElement.textContent = total;
        emptyMessage.hidden = total !== 0;
        chartDescription.textContent =
          createAccessibleDescription(total);
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const option = button.dataset.option;

          counts[option] += 1;

          saveCounts();
          updateChart();

          button.classList.remove("just-selected");
          void button.offsetWidth;
          button.classList.add("just-selected");

          window.setTimeout(() => {
            button.classList.remove("just-selected");
          }, 400);

          const total = getTotal();

          announcement.textContent =
            `${labels[option]} selected. ` +
            `${counts[option]} ` +
            `${counts[option] === 1 ? "response" : "responses"} ` +
            `for ${labels[option]}. ` +
            `${total} total ${total === 1 ? "response" : "responses"}.`;
        });
      });

      resetButton.addEventListener("click", () => {
        const shouldReset = window.confirm(
          "Reset all response counts to zero?"
        );

        if (!shouldReset) {
          return;
        }

        counts = { ...defaultCounts };

        saveCounts();
        updateChart();

        announcement.textContent =
          "All response counts have been reset to zero.";
      });

      updateChart();
    })();
  </script>
</body>
</html>
